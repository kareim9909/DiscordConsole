token: "PUT_BOT_TOKEN_HERE"

# ID القناة اللي تنقبل منها الأوامر (لازم تحطها)
channel-id: "000000000000000000"

# اللي يقدرون ينفذون أوامر: ID مستخدمين أو رتب (لازم واحد على الأقل، وإلا ما راح ينفذ شي)
allowed-user-ids: []
allowed-role-ids: []

# بادئة اختيارية قبل الأمر. اتركها فاضية إذا تبي كل رسالة بالقناة تنفذ
prefix: ""

# أوامر ممنوعة (أول كلمة من الأمر)
blocked-commands:
  - stop
  - restart
  - op
  - deop
  - reload
  - ban-ip

# ارسال ناتج الأمر للقناة
send-output: true
